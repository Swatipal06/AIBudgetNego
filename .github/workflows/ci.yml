name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          cd server && npm install
          cd ../client && npm install

      - name: Run Backend Tests
        env:
          NODE_ENV: test
          PORT: 8001
          MONGODB_URI: mongodb://localhost:27017/budget_agents_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_key_12345
          LLM_PROVIDER: mock
        run: |
          cd server && npm test

      - name: Build Frontend
        run: |
          cd client && npm run build
