version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: budget_agents_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - budget_network

  redis:
    image: redis:7-alpine
    container_name: budget_agents_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - budget_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: budget_agents_server
    restart: always
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - MONGODB_URI=mongodb://mongodb:27017/budget_agents
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=enterprise_production_jwt_secret_key_2026
      - CLIENT_URL=http://localhost:5173
      - LLM_PROVIDER=groq
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      - mongodb
      - redis
    networks:
      - budget_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: budget_agents_client
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - server
    networks:
      - budget_network

volumes:
  mongo_data:
  redis_data:

networks:
  budget_network:
    driver: bridge
